<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Organica — a browser-based Gray-Scott reaction-diffusion pattern engine. Tune parameters in real time and export print-quality PNGs.">
  <title>Organica — Reaction-Diffusion Engine</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%236e8efb'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --panel-bg: #111118;
      --border: #2a2a3a;
      --text: #c8c8d8;
      --accent: #6e8efb;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* TODO: Stage 8 — responsive layout (panel below canvas under 768px) */

    #topbar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
    }

    #topbar h1 {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    #main {
      display: flex;
      height: calc(100vh - 44px);
    }

    /* Canvas area */
    #canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      min-width: 0;
      position: relative;
    }

    #sim {
      border: 2px solid var(--border);
      box-shadow: 0 0 30px rgba(110, 142, 251, 0.15);
      image-rendering: pixelated;
      /* square canvas sized to fit the area left of the 300px panel */
      width: min(calc(100vh - 76px), calc(100vw - 332px));
      height: min(calc(100vh - 76px), calc(100vw - 332px));
    }

    /* Control panel */
    #panel {
      width: 300px;
      flex-shrink: 0;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 14px;
    }

    .panel-section {
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .panel-section:last-child { border-bottom: none; margin-bottom: 0; }

    .panel-section h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #8888a0;
      margin-bottom: 10px;
    }

    .param-row { margin-bottom: 12px; }

    .param-row .param-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .param-row label {
      font-size: 13px;
      color: var(--text);
    }

    .param-row .sym {
      color: #8888a0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      margin-left: 4px;
    }

    .param-row .val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #2a2a3a;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: -5px;
      transition: transform 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
    input[type="range"]::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: #2a2a3a;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
    }

    select, input[type="text"] {
      width: 100%;
      background: #191924;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }

    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .check-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      padding: 8px 12px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .btn:hover { background: rgba(110, 142, 251, 0.15); }

    .btn-filled {
      background: var(--accent);
      color: #0a0a0f;
    }
    .btn-filled:hover { background: #8aa4fc; }

    .seed-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .seed-row input { flex: 1; }
    .seed-row .btn {
      width: auto;
      flex-shrink: 0;
      padding: 6px 10px;
    }

    /* Canvas overlays */
    .overlay {
      position: absolute;
      bottom: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(200, 200, 216, 0.85);
      background: rgba(10, 10, 15, 0.55);
      padding: 3px 8px;
      border-radius: 4px;
      pointer-events: none;
    }
    #frameCounter { left: 24px; }
    #fpsCounter { right: 24px; }

    /* Preset buttons */
    #preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .preset-btn {
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .preset-btn:hover { background: rgba(110, 142, 251, 0.15); }
    .preset-btn.active {
      background: var(--accent);
      color: #0a0a0f;
    }

    /* CPU-fallback notice */
    #mode-banner {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(110, 142, 251, 0.12);
      border: 1px solid var(--accent);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 999px;
      display: none;
      pointer-events: none;
    }
    #mode-banner.visible { display: block; }

    /* TODO: Stage 7 — export buttons + progress modal */
    /* TODO: Stage 8 — keyboard shortcut legend, fullscreen button, About tooltip */
  </style>
</head>
<body>
  <!-- TODO: Stage 8 — About [?] tooltip, fullscreen button -->
  <header id="topbar">
    <h1>🧬 Reaction-Diffusion Engine</h1>
    <div id="topbar-actions"></div>
  </header>

  <div id="main">
    <div id="canvas-area">
      <canvas id="sim"></canvas>
      <div class="overlay" id="frameCounter">Frame: 0</div>

    <aside id="panel">
      <section class="panel-section" id="sec-presets">
        <h2>Presets</h2>
        <div id="preset-row"></div>
      </section>

      <section class="panel-section" id="sec-sim">
        <h2>Simulation</h2>

      </section>

      <section class="panel-section" id="sec-visual">
        <h2>Appearance</h2>
        <div class="param-row">
          <div class="param-head"><label for="ctl-palette">Colour Palette</label></div>
          <select id="ctl-palette">
            <!-- TODO: Stage 5 — enable the remaining palettes -->
            <option value="grayscale">Grayscale</option>

            <option value="inferno">Inferno</option>

            <option value="fire">Fire</option>

          </select>
        </div>
        <div class="check-row">
          <label for="ctl-invert">Invert Colours</label>

      <section class="panel-section" id="sec-init">

            <option value="spots" selected>Spots</option>

            <option value="random_scatter">Random scatter</option>
          </select>
        </div>
        <div class="param-row">
          <div class="param-head"><label for="ctl-seed">Seed Value</label></div>
          <div class="seed-row">
            <input type="text" id="ctl-seed" spellcheck="false" autocomplete="off">
            <button class="btn" id="btn-dice" title="Randomise seed">🎲</button>
          </div>
        </div>
        <div class="param-row">
          <div class="param-head"><label for="ctl-gridsize">Grid Size</label></div>
          <select id="ctl-gridsize">
            <option value="256">256 × 256</option>
            <option value="512" selected>512 × 512</option>

  <script>
    'use strict';

    /* ============================================================
       Organica — Gray-Scott reaction-diffusion engine
       Module map (single-file app):
         1. PRNG        — mulberry32 + string hashing (deterministic seeds)
         2. Parameters  — live parameter object read by the sim
         3. Simulation  — initGrid() / tick(): double-buffered CPU core
         4. Renderer    — palette LUT (linear RGB) for both render paths
         5. UI          — control panel wiring (sliders, presets, seed)
         6. GPU         — WebGL1 ping-pong FBO renderer, CPU fallback guard
         7. Main loop   — requestAnimationFrame; GPU or CPU per capability
       ============================================================ */

    /* ---------- 1. PRNG ---------- */
    function mulberry32(seed) {
      return function() {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function hashStr(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) {
        h = Math.imul(31, h) + s.charCodeAt(i) | 0;
      }
      return h >>> 0;
    }

    /* ---------- 2. Parameters ---------- */
    const params = {
      f: 0.055,             // feed rate
      k: 0.062,             // kill rate
      Du: 0.21,             // diffusion rate of U
      Dv: 0.105,            // diffusion rate of V
      stepsPerFrame: 10,    // simulation ticks per animation frame
      gridSize: 512,
      seed: '',
      seedMode: 'spots',
      palette: 'viridis',
      invert: false,
      colorBias: 0.5
    };

    /* ---------- 3. Simulation core ---------- */
    let W = 0, H = 0;           // grid dimensions
    let U, V, U_next, V_next;   // double-buffered chemical concentrations
    let frameCount = 0;

    const SEED_U = 0.5, SEED_V = 0.25;

    function paintBlob(cx, cy, radius, uVal, vVal) {
      const r2 = radius * radius;
      for (let dy = -radius; dy <= radius; dy++) {
        const yy = (((cy + dy) % H) + H) % H;
        const row = yy * W;
        const span = Math.floor(Math.sqrt(r2 - dy * dy));
        for (let dx = -span; dx <= span; dx++) {
          const xx = (((cx + dx) % W) + W) % W;
          const i = row + xx;
          U[i] = uVal;
          V[i] = vVal;
        }
      }
    }

    function paintSquare(cx, cy, half, uVal, vVal) {
      for (let dy = -half; dy <= half; dy++) {
        const yy = (((cy + dy) % H) + H) % H;
        const row = yy * W;
        for (let dx = -half; dx <= half; dx++) {
          const xx = (((cx + dx) % W) + W) % W;
          const i = row + xx;
          U[i] = uVal;
          V[i] = vVal;
        }
      }
    }

    // Paints a full-length band (horizontal strip if vertical=false).
    function paintBand(pos, thickness, vertical, uVal, vVal) {
      const along = vertical ? W : H;
      for (let a = pos; a < pos + thickness; a++) {
        const aa = ((a % along) + along) % along;
        for (let b = 0; b < (vertical ? H : W); b++) {
          const i = vertical ? (b * W + aa) : (aa * W + b);
          U[i] = uVal;
          V[i] = vVal;
        }
      }
    }

    function randomSeedString() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let s = '';
      for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    // Allocates and seeds both buffer pairs. Deterministic for a given
    // (seedStr, mode) pair: all randomness flows from mulberry32.
    function initGrid(w, h, seedStr, mode) {
      W = w; H = h;
      const n = w * h;
      U = new Float32Array(n);
      V = new Float32Array(n);
      U_next = new Float32Array(n);
      V_next = new Float32Array(n);
      U.fill(1);
      V.fill(0);

      const rand = mulberry32(hashStr(seedStr));

      switch (mode) {
        case 'spots': {
          const count = 20 + Math.floor(rand() * 61);            // 20-80 blobs
          for (let s = 0; s < count; s++) {
            paintBlob(Math.floor(rand() * w), Math.floor(rand() * h),
                      2 + Math.floor(rand() * 7), SEED_U, SEED_V); // radius 2-8
          }
          break;
        }
        case 'stripe': {
          const bands = 3 + Math.floor(rand() * 8);              // 3-10 bands
          const vertical = rand() < 0.5;
          const maxThick = Math.max(3, Math.floor((vertical ? w : h) / 64));
          for (let b = 0; b < bands; b++) {
            paintBand(Math.floor(rand() * (vertical ? w : h)),
                      1 + Math.floor(rand() * maxThick), vertical,
                      SEED_U, SEED_V);
          }
          break;
        }
        case 'noise': {
          for (let i = 0; i < n; i++) {
            U[i] = 0.8 + rand() * 0.2;                           // U in [0.8, 1]
            V[i] = rand() * 0.2;                                 // V in [0, 0.2]
          }
          break;
        }
        case 'center': {
          paintSquare(w >> 1, h >> 1, Math.max(4, w >> 3), SEED_U, SEED_V);
          break;
        }
        case 'corners': {
          const off = Math.max(4, w >> 3);
          const rad = Math.max(3, w >> 4);
          paintBlob(off, off, rad, SEED_U, SEED_V);
          paintBlob(w - off, off, rad, SEED_U, SEED_V);
          paintBlob(off, h - off, rad, SEED_U, SEED_V);
          paintBlob(w - off, h - off, rad, SEED_U, SEED_V);
          break;
        }
        case 'cross': {
          const thick = Math.max(2, Math.round(w / 128));
          paintBand((w >> 1) - (thick >> 1), thick, false, SEED_U, SEED_V);
          paintBand((h >> 1) - (thick >> 1), thick, true,  SEED_U, SEED_V);
          break;
        }
        case 'random_scatter': {
          for (let i = 0; i < n; i++) {
            U[i] = rand();
            V[i] = rand();
          }
          break;
        }
      }

      frameCount = 0;
    }

    // One discrete Gray-Scott step (dt = 1). Reads U/V, writes U_next/V_next,
    // then swaps — never updates in place. Toroidal wrapping boundaries.
    // Hot inner loop is split: interior columns use constant offsets, only the
    // first/last column pays for wrap-around index math.
    function tick(p) {
      const f = p.f, k = p.k, Du = p.Du, Dv = p.Dv;
      const _U = U, _V = V, _Un = U_next, _Vn = V_next;
      const lastX = W - 1;

      for (let y = 0; y < H; y++) {
        const yo = y * W;
        const ym = ((y - 1 + H) % H) * W;
        const yp = ((y + 1) % H) * W;

        // left edge column (wraps to right edge)
        {
          const i = yo;
          const r = i + 1;
          const uN = ym, dN = yp;
          const l = yo + lastX;
          const ul = ym + lastX, ur = ym + 1;
          const dl = yp + lastX, dr = yp + 1;
          const lapU = (_U[l] + _U[r] + _U[uN] + _U[dN]) * 0.20 +
                       (_U[ul] + _U[ur] + _U[dl] + _U[dr]) * 0.05 - _U[i];
          const lapV = (_V[l] + _V[r] + _V[uN] + _V[dN]) * 0.20 +
                       (_V[ul] + _V[ur] + _V[dl] + _V[dr]) * 0.05 - _V[i];
          const re = _U[i] * _V[i] * _V[i];
          let nu = _U[i] + (Du * lapU - re + f * (1 - _U[i]));
          let nv = _V[i] + (Dv * lapV + re - (f + k) * _V[i]);
          _Un[i] = nu < 0 ? 0 : nu > 1 ? 1 : nu;
          _Vn[i] = nv < 0 ? 0 : nv > 1 ? 1 : nv;
        }

        // interior columns
        for (let x = 1; x < lastX; x++) {
          const i = yo + x;
          const l = i - 1, r = i + 1;
          const uN = ym + x, dN = yp + x;
          const ul = uN - 1, ur = uN + 1;
          const dl = dN - 1, dr = dN + 1;

          // 9-tap weighted Laplacian: 0.20 cardinals, 0.05 diagonals, -1 centre
          const lapU = (_U[l] + _U[r] + _U[uN] + _U[dN]) * 0.20 +
                       (_U[ul] + _U[ur] + _U[dl] + _U[dr]) * 0.05 - _U[i];
          const lapV = (_V[l] + _V[r] + _V[uN] + _V[dN]) * 0.20 +
                       (_V[ul] + _V[ur] + _V[dl] + _V[dr]) * 0.05 - _V[i];

          const re = _U[i] * _V[i] * _V[i];

          let nu = _U[i] + (Du * lapU - re + f * (1 - _U[i]));
          let nv = _V[i] + (Dv * lapV + re - (f + k) * _V[i]);

          _Un[i] = nu < 0 ? 0 : nu > 1 ? 1 : nu;
          _Vn[i] = nv < 0 ? 0 : nv > 1 ? 1 : nv;
        }

        // right edge column (wraps to left edge)
        {
          const i = yo + lastX;
          const l = i - 1;
          const uN = ym + lastX, dN = yp + lastX;
          const r = yo;
          const ul = ym + lastX - 1, ur = ym;
          const dl = yp + lastX - 1, dr = yp;
          const lapU = (_U[l] + _U[r] + _U[uN] + _U[dN]) * 0.20 +
                       (_U[ul] + _U[ur] + _U[dl] + _U[dr]) * 0.05 - _U[i];
          const lapV = (_V[l] + _V[r] + _V[uN] + _V[dN]) * 0.20 +
                       (_V[ul] + _V[ur] + _V[dl] + _V[dr]) * 0.05 - _V[i];
          const re = _U[i] * _V[i] * _V[i];
          let nu = _U[i] + (Du * lapU - re + f * (1 - _U[i]));
          let nv = _V[i] + (Dv * lapV + re - (f + k) * _V[i]);
          _Un[i] = nu < 0 ? 0 : nu > 1 ? 1 : nu;
          _Vn[i] = nv < 0 ? 0 : nv > 1 ? 1 : nv;
        }
      }

      // Swap so the freshly written buffers become the read buffers.
      U = _Un; U_next = _U;
      V = _Vn; V_next = _V;
    }

    /* ---------- 4. Renderer (CPU Canvas2D path, palette LUT) ---------- */
    // NOTE: canvas is `let` — if WebGL initialises successfully it is swapped
    // for a GPU-backed canvas (a canvas can hold only one context type).
    let canvas = document.getElementById('sim');
    let ctx2d = null;
    let imgData = null;

    function cpuCtx() {
      if (!ctx2d) ctx2d = canvas.getContext('2d');
      return ctx2d;
    }

    // Palette stops as [t, r, g, b] with sRGB 0-255 channels.
    // viridis stops are exact (spec §7); others match their described character.
    const PALETTES = {
      grayscale: [
        [0.0,   0,   0,   0],
        [1.0, 255, 255, 255]
      ],
      viridis: [
        [0.0,   68,   1,  84],
        [0.25,  59,  82, 139],
        [0.5,   33, 145, 140],
        [0.75,  94, 201,  97],
        [1.0,  253, 231,  37]
      ],
      plasma: [
        [0.0,   13,   8, 135],
        [0.25, 126,   3, 168],
        [0.5,  204,  71, 120],
        [0.75, 248, 149,  64],
        [1.0,  240, 249,  33]
      ],
      inferno: [
        [0.0,    0,   0,   4],
        [0.25,  87,  16, 110],
        [0.5,  188,  55,  84],
        [0.75, 249, 142,   9],
        [1.0,  252, 255, 164]
      ],
      magma: [
        [0.0,    0,   0,   4],
        [0.25,  81,  18, 124],
        [0.5,  183,  55, 121],
        [0.75, 252, 137,  97],
        [1.0,  252, 253, 191]
      ],
      thermal: [
        [0.0,    0,   0,   0],
        [0.18,   0, 20, 160],
        [0.4,    0, 210, 230],
        [0.6,   30, 200,  60],
        [0.75, 250, 220,  30],
        [0.9,  235,  50,  30],
        [1.0,  255, 255, 255]
      ],
      ice: [
        [0.0,    0,   0,   0],
        [0.35,  10,  40, 140],
        [0.7,   60, 190, 230],
        [1.0,  255, 255, 255]
      ],
      fire: [
        [0.0,    0,   0,   0],
        [0.3,  140,  20,  10],
        [0.6,  245, 120,  20],
        [0.85, 255, 220,  60],
        [1.0,  255, 255, 240]
      ],
      alien: [
        [0.0,    0,   0,   0],
        [0.3,   10,  70,  20],
        [0.6,   30, 180,  60],
        [0.85, 160, 255,  60],
        [1.0,  240, 255, 220]
      ],
      neon: [
        [0.0,    5,   0,  20],
        [0.3,   90,  20, 180],
        [0.55, 255,  40, 180],
        [0.8,   40, 230, 255],
        [1.0,  255, 255, 255]
      ]
    };

    function srgbToLinear(c) {
      return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    }
    function linearToSrgb(c) {
      return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
    }

    // mapColor(v): bias remap -> invert -> palette lookup in linear RGB,
    // converted back to sRGB. Precomputed as a 256-entry LUT rebuilt only
    // when palette/invert/bias change.
    let colorLut = new Uint8Array(256 * 3);
    let lutKey = '';

    function buildColorLut() {
      const stops = PALETTES[params.palette] || PALETTES.grayscale;
      const lin = stops.map(([t, r, g, b]) =>
        [t, srgbToLinear(r / 255), srgbToLinear(g / 255), srgbToLinear(b / 255)]);
      const exponent = 1 / (params.colorBias * 2 + 0.1);

      for (let i = 0; i < 256; i++) {
        let v = Math.pow(i / 255, exponent);          // bias shifts midpoint
        if (params.invert) v = 1 - v;                 // swap low/high ends
        const x = v < 0 ? 0 : v > 1 ? 1 : v;

        let s = 0;
        while (s < lin.length - 2 && x > lin[s + 1][0]) s++;
        const a = lin[s], b = lin[s + 1];
        const span = b[0] - a[0];
        const u = span > 0 ? (x - a[0]) / span : 0;

        for (let ch = 0; ch < 3; ch++) {
          const lv = a[ch + 1] + (b[ch + 1] - a[ch + 1]) * u; // lerp in linear
          colorLut[i * 3 + ch] =
            Math.round(Math.max(0, Math.min(1, linearToSrgb(lv))) * 255);
        }
      }
      lutKey = params.palette + '|' + params.invert + '|' + params.colorBias;
    }

    function renderCPU() {
      const key = params.palette + '|' + params.invert + '|' + params.colorBias;
      if (key !== lutKey) buildColorLut();
      const ctx = cpuCtx();
      if (!ctx) return;
      if (!imgData || imgData.width !== W || imgData.height !== H) {
        canvas.width = W;
        canvas.height = H;
        imgData = ctx.createImageData(W, H);
        const d0 = imgData.data;
        for (let j = 3; j < d0.length; j += 4) d0[j] = 255; // opaque alpha
      }
      const d = imgData.data;
      for (let i = 0, j = 0; i < W * H; i++, j += 4) {
        const idx = ((V[i] * 255) | 0) * 3;
        d[j]     = colorLut[idx];
        d[j + 1] = colorLut[idx + 1];
        d[j + 2] = colorLut[idx + 2];
      }
      ctx.putImageData(imgData, 0, 0);
    }

    /* ---------- 5. UI — control panel wiring ---------- */
    const $ = (id) => document.getElementById(id);

    // Slider descriptors: id -> [label, symbol, min, max, step, decimals]
    // NOTE: f/k use step 0.0001 because the spec §5 preset values (e.g. 0.0545)
    // carry 4 decimals — a 0.001-step slider would snap and desync from presets.
    const SLIDERS = [
      ['f',             'Feed Rate',   'f',   0.010, 0.100, 0.0001, 4, 'sec-sim'],
      ['k',             'Kill Rate',   'k',   0.045, 0.075, 0.0001, 4, 'sec-sim'],
      ['Du',            'Diffusion U', 'Du',  0.050, 0.400, 0.005, 3, 'sec-sim'],
      ['Dv',            'Diffusion V', 'Dv',  0.010, 0.250, 0.005, 3, 'sec-sim'],
      ['stepsPerFrame', 'Steps / Frame', '',  1,     40,    1,     0, 'sec-sim'],
      ['colorBias',     'Colour Bias', '',    0.0,   1.0,   0.01,  2, 'sec-visual']
    ];

    const ctlRefs = {}; // key -> { input, out, decimals }

    function buildSliderRow(cfg) {
      const [key, label, sym, min, max, step, decimals, sectionId] = cfg;
      const row = document.createElement('div');
      row.className = 'param-row';
      row.innerHTML =
        `<div class="param-head">` +
          `<label for="ctl-${key}">${label}${sym ? `<span class="sym">${sym}</span>` : ''}</label>` +
          `<span class="val" id="val-${key}"></span>` +
        `</div>` +
        `<input type="range" id="ctl-${key}" min="${min}" max="${max}" step="${step}">`;
      $(sectionId).appendChild(row);

      const input = row.querySelector('input');
      const out = row.querySelector('.val');
      input.value = params[key];
      out.textContent = Number(params[key]).toFixed(decimals);
      ctlRefs[key] = { input, out, decimals };

      input.addEventListener('input', () => {
        params[key] = parseFloat(input.value);
        out.textContent = params[key].toFixed(decimals);
        if (key === 'f' || key === 'k') setActivePreset(null); // deviated from preset
      });
    }
    SLIDERS.forEach(buildSliderRow);

    /* ---------- Presets (spec §5) ---------- */
    const PRESETS = [
      { name: 'Coral',         f: 0.0545, k: 0.0620, seedMode: 'spots',          palette: 'fire',
        desc: 'Dense worm-like branching' },
      { name: 'Spots',         f: 0.0367, k: 0.0649, seedMode: 'spots',          palette: 'viridis',
        desc: 'Classic Turing spots' },
      { name: 'Labyrinth',     f: 0.0390, k: 0.0580, seedMode: 'noise',          palette: 'magma',
        desc: 'Endless maze corridors' },
      { name: 'Mitosis',       f: 0.0272, k: 0.0513, seedMode: 'spots',          palette: 'ice',
        desc: 'Cells that divide and drift' },
      { name: 'Solitons',      f: 0.0140, k: 0.0540, seedMode: 'center',         palette: 'plasma',
        desc: 'Stable moving blobs' },
      { name: 'Zebra',         f: 0.0620, k: 0.0609, seedMode: 'stripe',         palette: 'grayscale',
        desc: 'Parallel stripe bands' },
      { name: 'U-Skate World', f: 0.0620, k: 0.0610, seedMode: 'random_scatter', palette: 'thermal',
        desc: 'Self-propelled gliders' },
      { name: 'Extinction',    f: 0.0200, k: 0.0650, seedMode: 'cross',          palette: 'alien',
        desc: 'Pattern slowly dies (edge case)' }
    ];

    let activePresetBtn = null;

    function setActivePreset(name) {
      if (activePresetBtn) activePresetBtn.classList.remove('active');
      activePresetBtn = null;
      if (!name) return;
      const btn = $('preset-row').querySelector(`[data-preset="${name}"]`);
      if (btn) {
        btn.classList.add('active');
        activePresetBtn = btn;
      }
    }

    function applyPreset(preset) {
      params.f = preset.f;
      params.k = preset.k;
      ctlRefs.f.input.value = preset.f;
      ctlRefs.f.out.textContent = preset.f.toFixed(ctlRefs.f.decimals);
      ctlRefs.k.input.value = preset.k;
      ctlRefs.k.out.textContent = preset.k.toFixed(ctlRefs.k.decimals);

      params.seedMode = preset.seedMode;
      $('ctl-seedmode').value = preset.seedMode;

      if (preset.palette) {
        params.palette = preset.palette;
        $('ctl-palette').value = preset.palette;
      }

      params.seed = randomSeedString(); // each click feels fresh
      $('ctl-seed').value = params.seed;
      reseed();

      setActivePreset(preset.name);
    }

    function buildPresetButtons() {
      const rowEl = $('preset-row');
      PRESETS.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.dataset.preset = p.name;
        btn.textContent = p.name;
        btn.title = `${p.desc} — f=${p.f}, k=${p.k}`;
        btn.addEventListener('click', () => applyPreset(p));
        rowEl.appendChild(btn);
      });
    }
    buildPresetButtons();

    $('ctl-palette').addEventListener('change', () => {
      params.palette = $('ctl-palette').value; // LUT rebuilt on next render
    });

    $('ctl-invert').addEventListener('change', () => {
      params.invert = $('ctl-invert').checked;
    });

    function reseed() {
      initGrid(params.gridSize, params.gridSize, params.seed, params.seedMode);
      if (gpu.active) {
        gpuEnsureSize();
        uploadState();
      }
    }

    $('ctl-seedmode').addEventListener('change', () => {
      params.seedMode = $('ctl-seedmode').value;
      reseed();
    });

    $('ctl-seed').addEventListener('change', () => {
      params.seed = $('ctl-seed').value.trim() || randomSeedString();
      $('ctl-seed').value = params.seed;
      reseed();
    });

    $('btn-dice').addEventListener('click', () => {
      params.seed = randomSeedString();
      $('ctl-seed').value = params.seed;
      reseed();
    });

    $('ctl-gridsize').addEventListener('change', () => {
      params.gridSize = parseInt($('ctl-gridsize').value, 10);
      reseed();
    });

    $('btn-reset').addEventListener('click', reseed);

    /* ---------- 6. GPU renderer (WebGL1, ping-pong FBOs) ---------- */
    // Strategy: the whole pipeline is built on a detached canvas first. Only
    // when EVERY step succeeds (context, OES_texture_float, highp fragment
    // precision, shaders, float render targets) is that canvas swapped into
    // the DOM as #sim — a canvas can hold only one context type, so the CPU
    // path stays untouched if any probe fails.
    // Toroidal boundaries: WebGL1 forbids REPEAT on NPOT textures (grid 768),
    // so neighbour lookups wrap via fract() in the shader — same boundary
    // condition, valid for every grid size.
    const gpu = {
      active: false,
      gl: null,
      progSim: null, progDisp: null,
      uniSim: {}, uniDisp: {},
      tex: [null, null],
      fbo: [null, null],
      read: 0,
      lutTex: null,
      lutKeyGPU: '',
      size: 0,
      canReadback: false
    };

    const VERT_SRC = `
      attribute vec2 aPos;
      varying vec2 v_texCoord;
      void main() {
        v_texCoord = aPos * 0.5 + 0.5;
        gl_Position = vec4(aPos, 0.0, 1.0);
      }`;

    const SIM_FRAG_SRC = `
      precision highp float;
      uniform sampler2D uState;
      uniform float uF, uK, uDu, uDv, uDt;
      uniform vec2 uTexel;
      varying vec2 v_texCoord;

      vec2 s(vec2 off) {
        return texture2D(uState, fract(v_texCoord + off)).rg;
      }

      void main() {
        vec2 c = texture2D(uState, v_texCoord).rg;
        float U = c.r, V = c.g;

        vec2 lap = vec2(0.0);
        lap += 0.20 * (s(vec2( uTexel.x, 0.0)) + s(vec2(-uTexel.x, 0.0)) +
                       s(vec2(0.0,  uTexel.y)) + s(vec2(0.0, -uTexel.y)));
        lap += 0.05 * (s(vec2( uTexel.x,  uTexel.y)) + s(vec2(-uTexel.x,  uTexel.y)) +
                       s(vec2( uTexel.x, -uTexel.y)) + s(vec2(-uTexel.x, -uTexel.y)));
        lap -= c;

        float reaction = U * V * V;
        float dU = uDu * lap.r - reaction + uF * (1.0 - U);
        float dV = uDv * lap.g + reaction - (uF + uK) * V;

        gl_FragColor = vec4(clamp(U + uDt * dU, 0.0, 1.0),
                            clamp(V + uDt * dV, 0.0, 1.0), 0.0, 1.0);
      }`;

    const DISP_FRAG_SRC = `
      precision highp float;
      uniform sampler2D uState;
      uniform sampler2D uLut;
      varying vec2 v_texCoord;
      void main() {
        float V = texture2D(uState, v_texCoord).g;
        gl_FragColor = vec4(texture2D(uLut, vec2(V * (255.0 / 256.0) + 0.5 / 256.0, 0.5)).rgb, 1.0);
      }`;

    function setCpuMode() {
      if (!gpu.active) return;
      gpu.active = false;
      document.getElementById('mode-banner').classList.add('visible');
    }

    function glShader(gl, type, src) {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        console.warn('Organica shader error:', gl.getShaderInfoLog(sh));
        gl.deleteShader(sh);
        return null;
      }
      return sh;
    }

    function glProgram(gl, fragSrc) {
      const vs = glShader(gl, gl.VERTEX_SHADER, VERT_SRC);
      const fs = glShader(gl, gl.FRAGMENT_SHADER, fragSrc);
      if (!vs || !fs) return null;
      const prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.bindAttribLocation(prog, 0, 'aPos'); // shared quad layout
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        console.warn('Organica link error:', gl.getProgramInfoLog(prog));
        return null;
      }
      return prog;
    }

    function gpuCreateTargets(gl, w, h) {
      const texOpts = (tex) => {
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.FLOAT, null);
      };
      for (let i = 0; i < 2; i++) {
        gpu.tex[i] = gl.createTexture();
        texOpts(gpu.tex[i]);
        gpu.fbo[i] = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, gpu.fbo[i]);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
                                gl.TEXTURE_2D, gpu.tex[i], 0);
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
          return false; // float render targets unsupported
        }
      }
      gpu.read = 0;
      gpu.size = w;
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      return true;
    }

    function gpuDestroyTargets() {
      const gl = gpu.gl;
      if (!gl) return;
      for (let i = 0; i < 2; i++) {
        if (gpu.tex[i]) gl.deleteTexture(gpu.tex[i]);
        if (gpu.fbo[i]) gl.deleteFramebuffer(gpu.fbo[i]);
        gpu.tex[i] = null;
        gpu.fbo[i] = null;
      }
      gpu.size = 0;
    }

    function tryInitGPU() {
      let gl = null;
      const holder = document.createElement('canvas'); // detached probe canvas
      try {
        gl = holder.getContext('webgl', { preserveDrawingBuffer: true }) ||
             holder.getContext('experimental-webgl', { preserveDrawingBuffer: true });
        if (!gl) throw new Error('no webgl context');
        if (!gl.getExtension('OES_texture_float')) throw new Error('no OES_texture_float');

        // highp fragment precision is optional in WebGL1 and required here
        const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
        if (!hp || hp.precision === 0) throw new Error('no highp fragment precision');

        // WEBGL_color_buffer_float only gates guaranteed float READBACK
        gpu.canReadback = !!gl.getExtension('WEBGL_color_buffer_float');

        const progSim = glProgram(gl, SIM_FRAG_SRC);
        const progDisp = glProgram(gl, DISP_FRAG_SRC);
        if (!progSim || !progDisp) throw new Error('shader compile/link failed');
        if (!gpuCreateTargets(gl, params.gridSize, params.gridSize)) {
          throw new Error('float render targets incomplete');
        }

        // fullscreen quad (attribute 0, shared layout for both programs)
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

        // LUT texture (256x1 RGBA bytes)
        const lutTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, lutTex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        gpu.gl = gl;
        gpu.progSim = progSim;
        gpu.progDisp = progDisp;
        gpu.lutTex = lutTex;
        gpu.uniSim = {
          state: gl.getUniformLocation(progSim, 'uState'),
          f: gl.getUniformLocation(progSim, 'uF'),
          k: gl.getUniformLocation(progSim, 'uK'),
          du: gl.getUniformLocation(progSim, 'uDu'),
          dv: gl.getUniformLocation(progSim, 'uDv'),
          dt: gl.getUniformLocation(progSim, 'uDt'),
          texel: gl.getUniformLocation(progSim, 'uTexel')
        };
        gpu.uniDisp = {
          state: gl.getUniformLocation(progDisp, 'uState'),
          lut: gl.getUniformLocation(progDisp, 'uLut')
        };

        // adopt the working context: swap the GPU-backed canvas in as #sim
        holder.id = 'sim';
        holder.width = params.gridSize;
        holder.height = params.gridSize;
        canvas.parentNode.replaceChild(holder, canvas);
        canvas = holder;
        ctx2d = null;
        imgData = null;
        gpu.active = true;

        canvas.addEventListener('webglcontextlost', (e) => {
          e.preventDefault();
          gpuDestroyTargets();
          setCpuMode();
        }, false);

        uploadState();
      } catch (err) {
        gpu.active = false;
        document.getElementById('mode-banner').classList.add('visible');
      }
    }

    function packState() {
      const n = W * H;
      const out = new Float32Array(n * 4);
      for (let i = 0, j = 0; i < n; i++, j += 4) {
        out[j] = U[i];
        out[j + 1] = V[i];
        out[j + 3] = 1.0;
      }
      return out;
    }

    function uploadState() {
      const gl = gpu.gl;
      if (!gl || !gpu.size) return;
      gl.bindTexture(gl.TEXTURE_2D, gpu.tex[gpu.read]);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.FLOAT, packState());
    }

    function gpuEnsureSize() {
      if (!gpu.active || gpu.size === W) return;
      gpuDestroyTargets();
      if (!gpuCreateTargets(gpu.gl, W, H)) { setCpuMode(); return; }
      canvas.width = W;
      canvas.height = H;
      uploadState();
    }

    function gpuUploadLut() {
      const gl = gpu.gl;
      const rgba = new Uint8Array(256 * 4);
      for (let i = 0; i < 256; i++) {
        rgba[i * 4]     = colorLut[i * 3];
        rgba[i * 4 + 1] = colorLut[i * 3 + 1];
        rgba[i * 4 + 2] = colorLut[i * 3 + 2];
        rgba[i * 4 + 3] = 255;
      }
      gl.bindTexture(gl.TEXTURE_2D, gpu.lutTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
      gpu.lutKeyGPU = lutKey;
    }

    function gpuStep(steps) {
      const gl = gpu.gl;
      if (!gl || !gpu.size) return;
      gl.useProgram(gpu.progSim);
      gl.viewport(0, 0, W, H);
      gl.uniform1i(gpu.uniSim.state, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.uniform1f(gpu.uniSim.f, params.f);
      gl.uniform1f(gpu.uniSim.k, params.k);
      gl.uniform1f(gpu.uniSim.du, params.Du);
      gl.uniform1f(gpu.uniSim.dv, params.Dv);
      gl.uniform1f(gpu.uniSim.dt, 1.0); // spec: fixed timestep
      gl.uniform2f(gpu.uniSim.texel, 1 / W, 1 / H);

      for (let i = 0; i < steps; i++) {
        const write = 1 - gpu.read;
        gl.bindFramebuffer(gl.FRAMEBUFFER, gpu.fbo[write]);
        gl.bindTexture(gl.TEXTURE_2D, gpu.tex[gpu.read]);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gpu.read = write;
      }
    }

    function gpuDisplay() {
      const gl = gpu.gl;
      // compare against live params (module lutKey may be stale in GPU mode,
      // where the CPU blit never runs)
      const key = params.palette + '|' + params.invert + '|' + params.colorBias;
      if (key !== gpu.lutKeyGPU) {
        buildColorLut();
        gpuUploadLut();
      }
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, W, H);
      gl.useProgram(gpu.progDisp);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, gpu.tex[gpu.read]);
      gl.uniform1i(gpu.uniDisp.state, 0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, gpu.lutTex);
      gl.uniform1i(gpu.uniDisp.lut, 1);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    // Reads current GPU state back into the CPU arrays (U/V).
    // Rows arrive bottom-up from GL and are flipped during extraction.
    // Returns false when readback is unsupported (export then re-runs on CPU).
    function syncFromGPU() {
      if (!gpu.active || !gpu.canReadback) return false;
      const gl = gpu.gl;
      const buf = new Float32Array(W * H * 4);
      gl.bindFramebuffer(gl.FRAMEBUFFER, gpu.fbo[gpu.read]);
      gl.readPixels(0, 0, W, H, gl.RGBA, gl.FLOAT, buf);
      if (gl.getError() !== gl.NO_ERROR) return false;
      for (let y = 0; y < H; y++) {
        const srcRow = (H - 1 - y) * W * 4;
        const dstRow = y * W;
        for (let x = 0; x < W; x++) {
          U[dstRow + x] = buf[srcRow + x * 4];
          V[dstRow + x] = buf[srcRow + x * 4 + 1];
        }
      }
      return true;
    }

    /* ---------- 7. Main loop ---------- */
    const frameEl = $('frameCounter');
    const fpsEl = $('fpsCounter');
    let fpsFrames = 0;
    let fpsLast = performance.now();

    setInterval(() => {
      const now = performance.now();
      fpsEl.textContent = 'FPS: ' + Math.round(fpsFrames * 1000 / (now - fpsLast));
      fpsFrames = 0;
      fpsLast = now;
    }, 1000);

    function frame() {
      if (gpu.active) {
        gpuEnsureSize();
        gpuStep(params.stepsPerFrame);
        gpuDisplay();
      } else {
        for (let s = 0; s < params.stepsPerFrame; s++) tick(params);
        renderCPU();
      }
      frameCount++;
      fpsFrames++;
      frameEl.textContent = 'Frame: ' + frameCount;
      requestAnimationFrame(frame);
    }

    params.seed = randomSeedString();
    $('ctl-seed').value = params.seed;
    initGrid(params.gridSize, params.gridSize, params.seed, params.seedMode);
    tryInitGPU();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
